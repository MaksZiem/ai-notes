      <rect x="22" y="26" width="110" height="12" rx="6" fill="#a6f0cf" fill-opacity="0.8"/>
      <rect x="22" y="58" width="146" height="8" rx="4" fill="#ffffff" fill-opacity="0.18"/>
      <rect x="22" y="76" width="128" height="8" rx="4" fill="#ffffff" fill-opacity="0.18"/>
      <rect x="22" y="94" width="138" height="8" rx="4" fill="#ffffff" fill-opacity="0.18"/>
      <rect x="22" y="124" width="96" height="8" rx="4" fill="#ffffff" fill-opacity="0.12"/>
