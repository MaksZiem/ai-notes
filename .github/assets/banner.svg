    <text x="72" y="262" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#a1a1aa"><tspan x="72" dy="0">Notion-style notes with real-time co-editing,</tspan><tspan x="72" dy="30">semantic search, RAG chat and a tool-using agent.</tspan></text>
    <text x="72" y="364" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#71717a">NestJS · React + Vite · Tiptap · Yjs · PostgreSQL · Gemini</text>
