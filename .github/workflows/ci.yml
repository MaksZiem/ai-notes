name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  images:
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - app: backend
          - app: frontend
            build-args: |
              VITE_API_URL=https://api.ai-notes.zmax-dev.pl
              VITE_YJS_URL=wss://api.ai-notes.zmax-dev.pl/collab
          - app: frontend
            variant: test
            build-args: |
              VITE_API_URL=https://api.ai-notes-test.zmax-dev.pl
              VITE_YJS_URL=wss://api.ai-notes-test.zmax-dev.pl/collab
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.app }}
          push: true
          build-args: ${{ matrix.build-args }}
          tags: |
            ghcr.io/maksziem/ai-notes-${{ matrix.app }}:${{ matrix.variant || 'latest' }}
            ghcr.io/maksziem/ai-notes-${{ matrix.app }}:${{ matrix.variant && format('{0}-', matrix.variant) || '' }}${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}${{ matrix.variant }}
