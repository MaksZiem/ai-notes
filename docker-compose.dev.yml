name: ai-notes-dev

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ai_notes
      POSTGRES_PASSWORD: ai_notes
      POSTGRES_DB: ai_notes
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_notes -d ai_notes"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
